<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人语音选择游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 双人语音选择游戏</h1>
            <div class="score-board">
                <div class="player-score">
                    <span class="player-name">玩家1</span>
                    <span class="score" id="score1">0</span>
                </div>
                <div class="vs">VS</div>
                <div class="player-score">
                    <span class="player-name">玩家2</span>
                    <span class="score" id="score2">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="game-area">
                <div class="question-section">
                    <div class="question-number">题目 <span id="questionNum">1</span> / <span id="totalQuestions">10</span></div>
                    <div class="chinese-word" id="chineseWord">加载中...</div>
                    <button class="play-audio-btn" id="playAudioBtn">
                        🔊 播放语音
                    </button>
                </div>

                <div class="players-section">
                    <div class="player-area" id="player1Area">
                        <div class="player-header">
                            <h2>玩家1</h2>
                            <div class="player-status" id="player1Status">等待选择...</div>
                        </div>
                        <div class="options-grid" id="player1Options">
                            <!-- 选项将通过JS动态生成 -->
                        </div>
                    </div>

                    <div class="player-area" id="player2Area">
                        <div class="player-header">
                            <h2>玩家2</h2>
                            <div class="player-status" id="player2Status">等待选择...</div>
                        </div>
                        <div class="options-grid" id="player2Options">
                            <!-- 选项将通过JS动态生成 -->
                        </div>
                    </div>
                </div>

                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-content">
                        <h3 id="resultTitle">结果</h3>
                        <p id="resultText"></p>
                        <div class="correct-answer">
                            正确答案: <span id="correctAnswer"></span>
                        </div>
                        <button class="next-btn" id="nextBtn">下一题</button>
                    </div>
                </div>
            </div>

            <div class="start-screen" id="startScreen">
                <h2>欢迎来到双人语音选择游戏！</h2>
                <p>游戏规则：</p>
                <ul>
                    <li>系统会显示一个中文词语</li>
                    <li>点击"播放语音"按钮听四个读音相近的英文单词</li>
                    <li>两位玩家分别选择正确的英文单词</li>
                    <li>答对得分，看谁得分更高！</li>
                </ul>
                <button class="start-btn" id="startBtn">开始游戏</button>
            </div>

            <div class="end-screen" id="endScreen" style="display: none;">
                <h2>游戏结束！</h2>
                <div class="final-scores">
                    <div class="final-score">
                        <span class="final-player-name">玩家1</span>
                        <span class="final-score-value" id="finalScore1">0</span>
                    </div>
                    <div class="final-score">
                        <span class="final-player-name">玩家2</span>
                        <span class="final-score-value" id="finalScore2">0</span>
                    </div>
                </div>
                <div class="winner" id="winner"></div>
                <button class="restart-btn" id="restartBtn">重新开始</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
